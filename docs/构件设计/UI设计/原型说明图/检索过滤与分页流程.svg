<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", sans-serif; fill: #17233d; }
      .subtitle { font: 400 14px "Microsoft YaHei", sans-serif; fill: #667085; }
      .step { font: 700 15px "Microsoft YaHei", sans-serif; fill: #17233d; }
      .small { font: 400 11px "Microsoft YaHei", sans-serif; fill: #667085; }
      .branch { font: 700 12px "Microsoft YaHei", sans-serif; fill: #17233d; }
      .edge { stroke: #8ea3c2; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8ea3c2"/>
    </marker>
  </defs>
  <rect width="1500" height="780" fill="#f5f7fb"/>
  <rect x="34" y="28" width="1432" height="724" rx="22" fill="#ffffff" stroke="#dfe6f0"/>
  <text x="70" y="78" class="title">检索过滤与分页交互流程</text>
  <text x="70" y="106" class="subtitle">筛选条件变化时建立新快照；同一快照内翻页保持稳定，返回前再按当前公开范围复核。</text>

  <g>
    <rect x="68" y="176" width="230" height="110" rx="15" fill="#edf3ff" stroke="#b9cdf5"/>
    <text x="101" y="214" class="step">1 输入检索与筛选</text>
    <text x="101" y="241" class="small">关键词、类型、年份、领域、机构</text>
    <text x="101" y="261" class="small">同字段多值 OR；跨字段 AND</text>
  </g>
  <g>
    <rect x="366" y="176" width="230" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="399" y="214" class="step">2 参数规范化</text>
    <text x="399" y="241" class="small">空白压缩、大小写无关、白名单校验</text>
    <text x="399" y="261" class="small">条件变化时生成新查询快照</text>
  </g>
  <g>
    <rect x="664" y="176" width="230" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="697" y="214" class="step">3 候选与排序</text>
    <text x="697" y="241" class="small">标识符精确命中优先</text>
    <text x="697" y="261" class="small">相关性、年份、标题、对象 ID</text>
  </g>
  <g>
    <rect x="962" y="176" width="230" height="110" rx="15" fill="#e9f7f6" stroke="#b9dfdc"/>
    <text x="995" y="214" class="step">4 当前公开范围复核</text>
    <text x="995" y="241" class="small">回查正式数据、可见性与字段策略</text>
    <text x="995" y="261" class="small">总数与分面使用同一公开范围</text>
  </g>
  <g>
    <rect x="1260" y="176" width="164" height="110" rx="15" fill="#2358d8"/>
    <text x="1300" y="214" class="step" fill="#ffffff">5 返回结果</text>
    <text x="1292" y="241" class="small" fill="#dce7ff">结果卡 + 分面 + 总数</text>
    <text x="1292" y="261" class="small" fill="#dce7ff">稳定分页 token</text>
  </g>
  <path d="M298 231 L366 231" class="edge" marker-end="url(#arrow)"/>
  <path d="M596 231 L664 231" class="edge" marker-end="url(#arrow)"/>
  <path d="M894 231 L962 231" class="edge" marker-end="url(#arrow)"/>
  <path d="M1192 231 L1260 231" class="edge" marker-end="url(#arrow)"/>

  <g>
    <rect x="376" y="356" width="190" height="74" rx="12" fill="#fff8e7" stroke="#efd8a7"/>
    <text x="406" y="386" class="branch">参数非法</text>
    <text x="406" y="408" class="small">字段级提示，不发起检索</text>
    <rect x="594" y="356" width="200" height="74" rx="12" fill="#f7f8fa" stroke="#d9dee6"/>
    <text x="633" y="386" class="branch">无匹配结果</text>
    <text x="624" y="408" class="small">展示正常空集合与放宽建议</text>
    <rect x="822" y="356" width="214" height="74" rx="12" fill="#feefed" stroke="#efc5c0"/>
    <text x="858" y="386" class="branch">快照过期 / 服务失败</text>
    <text x="850" y="408" class="small">提示重新检索，不回退旧权限数据</text>
  </g>
  <path d="M481 286 L481 356" class="edge" marker-end="url(#arrow)"/>
  <path d="M694 286 L694 356" class="edge" marker-end="url(#arrow)"/>
  <path d="M929 286 L929 356" class="edge" marker-end="url(#arrow)"/>

  <g>
    <rect x="68" y="498" width="1356" height="202" rx="16" fill="#fbfcfe" stroke="#dfe6f0"/>
    <text x="100" y="538" class="title" style="font-size:19px">分页与反馈规则</text>
    <g transform="translate(100 572)">
      <rect x="0" y="0" width="390" height="94" rx="12" fill="#ffffff" stroke="#dfe6f0"/>
      <text x="22" y="31" class="branch">同一快照内翻页</text>
      <text x="22" y="55" class="small">保持查询条件与 token；排序不漂移。</text>
      <text x="22" y="75" class="small">页码按钮、上一页/下一页和当前范围同时可见。</text>
    </g>
    <g transform="translate(520 572)">
      <rect x="0" y="0" width="390" height="94" rx="12" fill="#ffffff" stroke="#dfe6f0"/>
      <text x="22" y="31" class="branch">筛选条件变化</text>
      <text x="22" y="55" class="small">返回第 1 页，建立新快照；活动筛选以 chip 展示。</text>
      <text x="22" y="75" class="small">任何 chip 可单项移除，也可一键清除。</text>
    </g>
    <g transform="translate(940 572)">
      <rect x="0" y="0" width="390" height="94" rx="12" fill="#ffffff" stroke="#dfe6f0"/>
      <text x="22" y="31" class="branch">权限收紧</text>
      <text x="22" y="55" class="small">旧快照也不得返回已隐藏记录。</text>
      <text x="22" y="75" class="small">页长不足保持正常；total 与 facets 同步重算。</text>
    </g>
  </g>
</svg>
